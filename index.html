        /* ============ CLOZE: генерация из предложения ============ */
        function generateClozeFromText(rawLine) {
            // Если пользователь обернул слово в **...**, берём именно его
            var manualMatch = rawLine.match(/\*\*(.+?)\*\*/);
            var text = rawLine.replace(/\*\*(.+?)\*\*/g, '$1').trim();
            if (!text) return null;
            var words = text.split(/\s+/);
            if (words.length < 2) return null;

            var candidateIndices = [];
            if (manualMatch) {
                var targetWord = manualMatch[1].trim();
                for (var i = 0; i < words.length; i++) {
                    var clean = words[i].replace(/[.,!?;:()«»"']/g, '');
                    if (clean.toLowerCase() === targetWord.toLowerCase()) { candidateIndices.push(i); break; }
                }
            }
            if (!candidateIndices.length) {
                for (var i = 1; i < words.length - 1; i++) {
                    var clean = words[i].replace(/[.,!?;:()«»"']/g, '');
                    if (clean.length >= 3 && /[а-яa-z]/i.test(clean)) candidateIndices.push(i);
                }
                if (!candidateIndices.length) for (var i = 0; i < words.length; i++) {
                    var clean = words[i].replace(/[.,!?;:()«»"']/g, '');
                    if (clean.length >= 3) candidateIndices.push(i);
                }
            }
            if (!candidateIndices.length) return null;

            var idx = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];
            var answerWord = words[idx].replace(/[.,!?;:()«»"']/g, '');
            var newWords = words.slice();
            newWords[idx] = '___';
            var newText = newWords.join(' ');
            return { id: 'cz_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), text: newText, answers: [answerWord] };
        }

            if (entry.text && Array.isArray(entry.answers)) return entry;
            return null;
        }

        function getGiftExpiryText(expiresAt) {

        async function fetchSocialGiftInbox() {
            if (!socialUser) return [];

            if (expiryResult.error) throw expiryResult.error;
            if (expiryResult.data && expiryResult.data.auto_claimed > 0 && expiryResult.data.recipient_data) {

                updateScoreUI();

                .select('id,sender_id,receiver_id,gift_type,sticker_id,status,created_at,expires_at,claimed_at')
                .eq('receiver_id', socialUser.id)
                .in('status', ['pending', 'claimed', 'auto_claimed'])
                .order('created_at', { ascending: false })
                .limit(50);
            if (result.error) throw result.error;
            var gifts = result.data || [];
            var senderIds = [];
            for (var i = 0; i < gifts.length; i++) {
                if (senderIds.indexOf(gifts[i].sender_id) === -1) senderIds.push(gifts[i].sender_id);
            }

                    .select('id,display_name,friend_code')
                    .in('id', senderIds);

                for (var j = 0; j < (sendersResult.data || []).length; j++) senders[sendersResult.data[j].id] = sendersResult.data[j];

        async function refreshSocialChatList() {

                .select('id,name,is_group,updated_at')
                .in('id', chatIds)
                .order('updated_at', { ascending: false });

                .select('chat_id,user_id')

                    .select('id,display_name,friend_code')

                (profileResult.data || []).forEach(function (profile) { profiles[profile.id] = profile; });
            }
            chats.forEach(function (chat) {
                socialChatMetadata[chat.id] = {
                    chat: chat,
                    members: members.filter(function (member) { return member.chat_id === chat.id; }).map(function (member) {
                        return { user_id: member.user_id, profile: profiles[member.user_id] || null };
                    })

            });
            var previewResult = await supabaseClient.from('social_chat_messages')
                .select('id,chat_id,sender_id,body,attachment_name,created_at')
                .in('chat_id', validIds)
                .order('created_at', { ascending: false })

        function renderSocialChatMessages(messages, attachmentUrls, shouldKeepNearBottom) {
            var container = $('socialChatMessages');

            var distanceFromBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            var wasNearBottom = shouldKeepNearBottom && container.scrollTop > 0 && distanceFromBottom >= 0 && distanceFromBottom < 90;
            var existing = {};
            Array.prototype.forEach.call(container.children, function (element) {
                if (element.dataset.messageId) existing[element.dataset.messageId] = element;
            });
            var visibleIds = {};
            var renderPosition = container.firstElementChild;
            messages.forEach(function (message) {
                visibleIds[message.id] = true;
                var meta = socialChatMetadata[socialChatActiveId];
                var sender = meta && meta.members.find(function (member) { return member.user_id === message.sender_id; });
                var senderName = message.sender_id === socialUser.id ? 'Вы' : (sender && sender.profile ? sender.profile.display_name : 'Игрок');
                var url = attachmentUrls[message.id] || '';
                var version = [message.body, message.sender_id, message.created_at, message.attachment_path || '', message.attachment_name || '', message.attachment_mime || '', url].join('\u001f');
                var previousElement = existing[message.id];
                var element = previousElement;
                if (element && element.dataset.version === version) {
                    if (element !== renderPosition) container.insertBefore(element, renderPosition);
                    renderPosition = element.nextElementSibling;
                    return;
                }
                element = document.createElement('div');
                element.className = 'social-chat-message' + (message.sender_id === socialUser.id ? ' mine' : '');
                element.dataset.messageId = message.id;
                element.dataset.version = version;
                if (message.body) {
                    var body = document.createElement('div');

                    body.textContent = message.body;

                if (message.attachment_path) {

                        imageLink.setAttribute('aria-label', 'Открыть изображение: ' + (message.attachment_name || 'Изображение'));

                        var image = document.createElement('img');

                        image.alt = message.attachment_name || 'Изображение';
                        image.loading = 'lazy';
                        imageLink.appendChild(image);
                        element.appendChild(imageLink);
                    }
                    var attachmentRow = document.createElement('div');
                    attachmentRow.className = 'social-chat-attachment';
                    var attachmentLabel = document.createElement('span');
                    attachmentLabel.textContent = '📎 ' + (message.attachment_name || 'Файл');
                    attachmentRow.appendChild(attachmentLabel);
                    if (url) {
                        var downloadButton = document.createElement('button');
                        downloadButton.type = 'button';
                        downloadButton.className = 'btn btn-sm btn-outline';

                    element.appendChild(attachmentRow);

                element.appendChild(details);
                if (message.sender_id === socialUser.id) {
                    var deleteButton = document.createElement('button');

                    deleteButton.textContent = '🗑 Удалить';
                    deleteButton.setAttribute('aria-label', 'Удалить своё сообщение');
                    deleteButton.onclick = function () { removeSocialChatMessage(message); };
                    element.appendChild(deleteButton);
                }
                if (previousElement && previousElement.parentNode === container) {
                    container.replaceChild(element, previousElement);
                    if (previousElement === renderPosition) renderPosition = element.nextElementSibling;
                } else {
                    container.insertBefore(element, renderPosition);
                    renderPosition = element.nextElementSibling;
                }
            });
            Array.prototype.forEach.call(container.children, function (element) {
                if (element.dataset.messageId && !visibleIds[element.dataset.messageId]) element.remove();

            if (wasNearBottom) container.scrollTop = container.scrollHeight;

        async function downloadSocialChatAttachment(url, fileName, button) {

                var response = await fetch(url);
                if (!response.ok) throw new Error('Не удалось загрузить файл (' + response.status + ').');
                var objectUrl = URL.createObjectURL(await response.blob());
                var link = document.createElement('a');
                link.href = objectUrl;
                link.download = fileName || 'Файл';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 60000);
            } catch (error) {
                console.error('Не удалось скачать вложение чата:', error);
                toast('Не удалось скачать файл: ' + (error.message || 'ошибка загрузки.'));

                if (button.isConnected) button.disabled = false;

        async function refreshSocialChatMessages(isInitial) {
            var chatId = socialChatActiveId;
            if (!chatId) return;
            Object.keys(socialChatAttachmentUrlCache).forEach(function (path) {
                if (socialChatAttachmentUrlCache[path].expiresAt <= Date.now()) delete socialChatAttachmentUrlCache[path];
            });
            var result = await supabaseClient.from('social_chat_messages')
                .select('id,chat_id,sender_id,body,attachment_path,attachment_name,attachment_mime,attachment_size,created_at')
                .eq('chat_id', chatId)
                .order('created_at', { ascending: true })
                .order('id', { ascending: true })
                .limit(50);
            if (result.error) throw result.error;
            var messages = result.data || [];
            if (chatId !== socialChatActiveId) return;
            var chatMeta = socialChatMetadata[chatId];
            if (!chatMeta) return;
            var ids = messages.map(function (message) { return message.id; });
            var previousIds = socialChatKnownMessageIds[chatId] || [];
            if (!isInitial && socialChatInitialMessagesLoaded) {
                var newMessages = messages.filter(function (message) {
                    return previousIds.indexOf(message.id) < 0 && message.sender_id !== socialUser.id;
                });
                newMessages.forEach(function (message) { notifySocialChatMessage(message, chatId); });
            }
            socialChatKnownMessageIds[chatId] = ids;
            socialChatInitialMessagesLoaded = true;
            var attachmentUrls = {};
            for (var i = 0; i < messages.length; i++) {
                if (!messages[i].attachment_path) continue;
                var cachedUrl = socialChatAttachmentUrlCache[messages[i].attachment_path];
                if (!cachedUrl || cachedUrl.expiresAt <= Date.now()) {
                    var signedResult = await supabaseClient.storage.from('chat-attachments')
                        .createSignedUrl(messages[i].attachment_path, 3600);
                    if (signedResult.error) throw signedResult.error;
                    cachedUrl = {
                        url: signedResult.data.signedUrl,
                        expiresAt: Date.now() + 55 * 60 * 1000
                    };
                    socialChatAttachmentUrlCache[messages[i].attachment_path] = cachedUrl;
                }
                attachmentUrls[messages[i].id] = cachedUrl.url;
            }
            renderSocialChatMessages(messages, attachmentUrls, !isInitial);
            var title = $('socialChatRoomTitle');
            if (title) title.textContent = getSocialChatTitle(chatId);
            var rename = $('renameSocialGroup');
            if (rename) rename.hidden = !chatMeta.chat.is_group;

        function notifySocialChatMessage(message, chatId) {

                    var uniqueId = window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
                    attachmentPath = chatId + '/' + socialUser.id + '/' + uniqueId + '-' + safeName;

                        .select('id,chat_id,sender_id,body,attachment_name,created_at')

                    });
                    chatIds.forEach(function (chatId) {
                        var latest = latestByChat[chatId];
                        if (!latest) return;
                        var known = socialChatKnownMessageIds[chatId] || [];
                        if (!socialChatNotificationBaselineLoaded) {
                            socialChatKnownMessageIds[chatId] = [latest.id];

                        }
                        var changed = known.length && known.indexOf(latest.id) < 0;

                        if (changed && latest.sender_id !== socialUser.id && !isViewingThisChat) notifySocialChatMessage(latest, chatId);

                if (socialChatActiveId && $('socialChatLayout')) await refreshSocialChatMessages(false);

                if (message !== socialChatLastPollError) {

            } finally {
                socialChatPollInProgress = false;
            }
        }

                if (!$('chatsContent')) return;
                if ($('createGroupChat')) $('createGroupChat').disabled = true;
                $('chatsContent').innerHTML = '<div class="panel"><p>' + esc(error.message || 'Не удалось загрузить чаты.') + '</p><button class="btn btn-outline" id="retrySocialChats">Повторить</button></div>';
                $('retrySocialChats').onclick = showChats;
            }
        }
        async function showOnlinePlayerProfile(userId) {
            stopSocialRefreshTimers();
            closeSocialChatRoom();
            var content = $('friendsContent');
            if (!content || !supabaseClient) return;
            content.innerHTML = '<div class="panel">Загружаем профиль игрока...</div>';
            try {
                var result = await supabaseClient.from('player_public_profiles').select('profile_data,updated_at').eq('user_id', userId).maybeSingle();
                if (result.error) throw result.error;
                if (!result.data || !result.data.profile_data) throw new Error('У этого игрока ещё нет облачной копии профиля. Попросите его войти в игру с подключением к интернету.');
                var profile = result.data.profile_data;
                var program = profile.selectedProgram;
                var html = '<div class="flex-between mb-2"><h3 style="font-size:18px;">👤 Профиль игрока</h3><button class="btn btn-sm btn-outline" id="backToFriends">← К друзьям</button></div>' + makeSocialProfileHero(profile, true);
                if (program) {
                    html += '<div class="panel social-friend-program"><div class="panel-title">📚 Программа: ' + esc(program.name || 'Программа') + '</div>';
                    html += '<p class="social-friend-program-counts">Карточек: ' + (program.mode1 || []).length + ' · Викторин: ' + (program.mode2 || []).length + ' · Письменных заданий: ' + (program.mode3 || []).length + ' · Пропусков: ' + (program.cloze || []).length + '</p>';
                    html += '<button class="btn btn-primary" id="downloadFriendProgram" type="button">⬇️ Скачать программу</button></div>';
                } else html += '<div class="panel">Выбранная программа не указана.</div>';
                var giftStickerIds = Object.keys(appState.inventory || {}).filter(function (id) { return appState.inventory[id] > 0 && !!getStickerById(id); });
                var canGiftPremium = !!(appState.pass && appState.pass.premium) && !profile.premiumPass;
                html += '<div class="panel social-friend-profile-actions"><button class="btn btn-outline" id="startFriendChat" type="button">💬 Написать сообщение</button><div class="panel-title">🎁 Подарок другу</div><div class="social-gift-controls">';
                if (canGiftPremium) html += '<button class="btn btn-gold" id="giftPremium">👑 Подарить премиум-пропуск</button>';
                else if (profile.premiumPass) html += '<p>У друга уже есть премиум-пропуск.</p>';
                else html += '<p>У тебя пока нет премиум-пропуска для подарка.</p>';
                if (giftStickerIds.length) {
                    html += '<label for="giftStickerSelect">Выбери стикер из своей коллекции</label><select id="giftStickerSelect">';
                    for (var i = 0; i < giftStickerIds.length; i++) {
                        var giftSticker = getStickerById(giftStickerIds[i]);
                        html += '<option value="' + esc(giftSticker.id) + '">' + esc(giftSticker.emoji + ' ' + giftSticker.name + ' · в наличии: ' + appState.inventory[giftSticker.id]) + '</option>';
                    }
                    html += '</select><button class="btn btn-primary" id="giftSticker">🎴 Отправить стикер</button>';
                } else html += '<p>Нет стикеров, которые можно подарить.</p>';
                html += '<small>Подарок будет списан из твоей коллекции. Отменить отправку нельзя.</small></div></div>';
                content.innerHTML = html;
                $('backToFriends').onclick = renderOnlineFriends;
                var downloadProgramButton = $('downloadFriendProgram');
                if (downloadProgramButton) downloadProgramButton.onclick = function () {
                    var exportableProgram = {
                        name: program.name || 'Программа',
                        createdAt: Date.now(),
                        mode1: Array.isArray(program.mode1) ? program.mode1 : [],
                        mode2: Array.isArray(program.mode2) ? program.mode2 : [],
                        mode3: Array.isArray(program.mode3) ? program.mode3 : [],
                        cloze: Array.isArray(program.cloze) ? program.cloze : []
                    };
                    exportProgram(exportableProgram);
                };
                var giftPremiumButton = $('giftPremium');
                $('startFriendChat').onclick = function () { startSocialDirectChat(userId); };
                if (giftPremiumButton) giftPremiumButton.onclick = function () { sendSocialGift(userId, 'premium', null); };
                var giftStickerButton = $('giftSticker');
                if (giftStickerButton) giftStickerButton.onclick = function () { sendSocialGift(userId, 'sticker', $('giftStickerSelect').value); };
            } catch (error) {
                console.error('Ошибка загрузки профиля друга:', error);
                content.innerHTML = '<div class="panel"><p>' + esc(error.message || 'Не удалось загрузить профиль игрока.') + '</p><button class="btn btn-outline" id="backToFriends">← К друзьям</button></div>';
                $('backToFriends').onclick = renderOnlineFriends;
            }
        }
        function showStyleSettings() {
            var s = appState.styleSettings;
            var html = '<div class="flex-between mb-2"><h2 style="font-weight:700;font-size:18px;">🎨 Стили заданий</h2><button class="btn btn-sm btn-outline" id="back">← В меню</button></div><div class="panel"><div class="panel-title">Цвета по типам</div><div class="style-picker"><div class="style-label">🃏 Карточки</div><input type="color" id="colorCard" value="' + s.cardColor + '" style="width:60px;flex:0;"><div class="style-preview" style="border-left-color:' + s.cardColor + ';">Пример</div></div><div class="style-picker"><div class="style-label">🎯 Викторина</div><input type="color" id="colorQuiz" value="' + s.quizColor + '" style="width:60px;flex:0;"><div class="style-preview" style="border-left-color:' + s.quizColor + ';">Пример</div></div><div class="style-picker"><div class="style-label">✍️ Письменный</div><input type="color" id="colorInput" value="' + s.inputColor + '" style="width:60px;flex:0;"><div class="style-preview" style="border-left-color:' + s.inputColor + ';">Пример</div></div><div class="style-picker"><div class="style-label">📝 Пропуски</div><input type="color" id="colorCloze" value="' + s.clozeColor + '" style="width:60px;flex:0;"><div class="style-preview" style="border-left-color:' + s.clozeColor + ';">Пример</div></div><div class="style-picker"><div class="style-label">⚡ Спринт</div><input type="color" id="colorSprint" value="' + s.sprintColor + '" style="width:60px;flex:0;"><div class="style-preview" style="border-left-color:' + s.sprintColor + ';">Пример</div></div></div><div class="btn-group" style="justify-content:flex-end;"><button class="btn btn-outline" id="resetStyles">🔄 Сбросить</button><button class="btn btn-primary" id="saveStyles">💾 Применить</button></div>';
            render(html);
            $('back').onclick = function () { playClick(); showMainMenu(); };
            function readAndSave() { s.cardColor = $('colorCard').value; s.quizColor = $('colorQuiz').value; s.inputColor = $('colorInput').value; s.clozeColor = $('colorCloze').value; s.sprintColor = $('colorSprint').value; appState.styleSettings = s; saveState(); applyStyles(); }
            ['colorCard', 'colorQuiz', 'colorInput', 'colorCloze', 'colorSprint'].forEach(function (id) { var el = $(id); if (el) el.oninput = readAndSave; });
            $('saveStyles').onclick = function () { playClick(); readAndSave(); toast('✅ Применено'); };
            $('resetStyles').onclick = function () { playClick(); appState.styleSettings = { cardColor: '#5f7cff', quizColor: '#e74c3c', inputColor: '#2ecc71', clozeColor: '#f39c12', sprintColor: '#b368ff', fontQuestion: 'system-ui', fontAnswer: 'system-ui', fontSizeCard: 22, fontSizeQuestion: 19, fontSizeAnswer: 15 }; saveState(); applyStyles(); showStyleSettings(); };
        }
        function showProfile() {
            var lvlInfo = getLevelProgress(appState.globalScore);
            var profile = {
                playerName: appState.playerName,
                playerAvatar: appState.playerAvatar,
                playerAvatarImg: appState.playerAvatarImg,
                level: lvlInfo.level,
                globalScore: appState.globalScore,
                crystals: appState.crystals,
                streak: appState.streak,
                tasksCompleted: appState.tasksCompleted,
                themePack: appState.themePack,
                background: appState.background,
                collectionFrame: appState.equippedCollectionSet,
                premiumPass: !!(appState.pass && appState.pass.premium),
                lightTheme: document.body.classList.contains('light')
            };
            var html = '<div class="flex-between mb-2"><h2 style="font-weight:700;font-size:18px;">👤 Профиль</h2><button class="btn btn-sm btn-outline" id="back">← В меню</button></div>' + makeSocialProfileHero(profile, true);
            html += '<div class="panel"><div class="panel-title">✏️ Настройки</div><input type="text" id="profileNameInput" value="' + esc(appState.playerName) + '" maxlength="20" style="margin-bottom:10px;"><div class="btn-group" id="avatarPicker">' + ['😀', '😎', '🤓', '🧑‍🎓', '🦊', '🐼', '🐯', '🦄', '🐲', '👽', '🤖', '🧙', '🥷', '👑', '💎', '🔥', '⚡', '🌟', '🌈', '🍀', '🎓', '🚀'].map(function (e) { return '<button class="btn btn-sm btn-outline" data-av="' + e + '" style="font-size:20px;min-width:42px;">' + e + '</button>'; }).join('') + '</div><button class="btn btn-primary mt-2" id="saveProfile" style="width:100%;">💾 Сохранить</button></div>';
            render(html);
            $('back').onclick = function () { playClick(); showMainMenu(); };
            var selectedAvatar = appState.playerAvatar;
            var avBtns = document.querySelectorAll('#avatarPicker [data-av]');
            for (var i = 0; i < avBtns.length; i++) avBtns[i].onclick = function () { playClick(); selectedAvatar = this.getAttribute('data-av'); for (var j = 0; j < avBtns.length; j++) avBtns[j].classList.remove('btn-primary'); this.classList.add('btn-primary'); };
            $('saveProfile').onclick = function () { playClick(); appState.playerName = $('profileNameInput').value.trim() || 'Игрок'; appState.playerAvatar = selectedAvatar; appState.playerAvatarImg = null; saveState(); updateScoreUI(); toast('Сохранено'); showProfile(); };
        }
        function showSettings() {
            var html = '<div class="flex-between mb-2"><h2 style="font-weight:700;font-size:18px;">⚙️ Настройки</h2><button class="btn btn-sm btn-outline" id="back">← В меню</button></div><div class="panel"><div class="panel-title">🔊 Звук</div><label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-bottom:10px;"><input type="checkbox" id="setSound"' + (soundEnabled ? ' checked' : '') + '> Звуковые эффекты</label><label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;"><input type="checkbox" id="setTts"' + (ttsEnabled ? ' checked' : '') + '> Озвучка (TTS)</label></div><div class="panel"><div class="panel-title">💾 Данные</div><button class="btn btn-outline mb-2" id="exportAll" style="width:100%;">📤 Экспорт JSON</button><button class="btn btn-outline mb-2" id="exportPDF" style="width:100%;">📄 Экспорт PDF</button><button class="btn btn-danger" id="resetAll" style="width:100%;">🗑 Сбросить всё</button></div>';
            render(html);
            $('back').onclick = function () { playClick(); showMainMenu(); };
            $('setSound').onchange = function () { soundEnabled = this.checked; try { localStorage.setItem('learn_sound', soundEnabled ? '1' : '0'); } catch (e) { } updateSoundBtn(); };
            $('setTts').onchange = function () { ttsEnabled = this.checked; };
            $('exportAll').onclick = function () { downloadFile('learn_backup_' + getTodayString() + '.json', JSON.stringify(appState, null, 2), 'application/json'); toast('Экспортировано'); };
            $('exportPDF').onclick = function () { playClick(); exportToPDF(); };
            $('resetAll').onclick = function () {
                showConfirmModal('Сбросить ВСЁ?', async function () {
                    try {
                        if (socialUser) {
                            clearTimeout(socialCloudSyncTimer);
                            var privateDelete = await supabaseClient.from('player_data').delete().eq('user_id', socialUser.id);
                            if (privateDelete.error) throw privateDelete.error;
                            var publicDelete = await supabaseClient.from('player_public_profiles').delete().eq('user_id', socialUser.id);
                            if (publicDelete.error) throw publicDelete.error;
                            localStorage.removeItem(STORAGE_KEY + '_account_' + socialUser.id);
                        }
                        localStorage.removeItem(STORAGE_KEY);
                        location.reload();
                    } catch (error) {
                        console.error('Не удалось сбросить данные:', error);
                        toast('Не удалось сбросить данные: ' + (error.message || 'ошибка Supabase'));
                    }
                });
            };
        }

        /* ============ СТАРТ ============ */
        try {
            var savedTheme = 'dark';
            try { savedTheme = localStorage.getItem('learn_theme') || 'dark'; } catch (e) { }
            if (savedTheme === 'light') document.body.classList.add('light');
            $('themeBtn').textContent = savedTheme === 'light' ? '☀️' : '🌙';
            $('themeBtn').onclick = function () { if (document.body.classList.contains('light')) { document.body.classList.remove('light'); appState.theme = 'dark'; try { localStorage.setItem('learn_theme', 'dark'); } catch (e) { } $('themeBtn').textContent = '🌙'; } else { document.body.classList.add('light'); appState.theme = 'light'; try { localStorage.setItem('learn_theme', 'light'); } catch (e) { } $('themeBtn').textContent = '☀️'; } saveState(); playClick(); };
            try { var snd = localStorage.getItem('learn_sound'); if (snd !== null) soundEnabled = (snd === '1'); } catch (e) { }
            updateSoundBtn();
            $('soundBtn').onclick = function () { soundEnabled = !soundEnabled; try { localStorage.setItem('learn_sound', soundEnabled ? '1' : '0'); } catch (e) { } updateSoundBtn(); if (soundEnabled) playClick(); };
            loadState(); appState.theme = savedTheme; applyStyles(); applyThemePack(); applyBackground();
            dailyMotivationPending = appState.lastVisitDate !== getTodayString();
            var prevStreak = appState.streak; updateStreak(); updateScoreUI(); updateStreakUI();
            if (appState.streak > prevStreak && prevStreak > 0) setTimeout(function () { playStreak(); toast('🔥 Серия: ' + appState.streak + ' ' + pluralDays(appState.streak)); }, 800);
            if (canClaimReward()) setTimeout(function () { var info = claimDailyReward(false); if (info) { updateScoreUI(); updateStreakUI(); showRewardModal(info); } }, 600);
            $('streakBadge').onclick = function () { playClick(); if (canClaimReward()) { var info = claimDailyReward(true); if (info) { updateScoreUI(); updateStreakUI(); showRewardModal(info); } } else toast('🔥 Серия: ' + appState.streak + ' ' + pluralDays(appState.streak)); };
            $('avatarWrap').onclick = function () { playClick(); showProfile(); };
            $('shopBtn').onclick = function () { playClick(); showShop(); };
            $('settingsBtn').onclick = function () { playClick(); showSettings(); };
            $('btnPrograms').onclick = function () { playClick(); showProgramsMenu(); };
            showMainMenu();
            if (supabaseClient) {
                supabaseClient.auth.getSession().then(async function (result) {
                    if (result.error) throw result.error;
                    if (result.data.session) {
                        await loadSocialCloudState(result.data.session.user, false);
                        socialAuthRestorePending = false;
                        showMainMenu();
                        await notifyReceivedGifts();
                        return;
                    }
                    socialAuthRestorePending = false;
                    showMainMenu();
                }).catch(function (error) {
                    console.error('Не удалось загрузить облачное состояние аккаунта:', error);
                    socialAuthRestorePending = false;
                    showMainMenu();
                    toast('Не удалось загрузить облачную копию: ' + (error.message || 'ошибка Supabase'));
                });
            }
            document.addEventListener('click', function once() { initAudio(); document.removeEventListener('click', once); }, { once: true });
        } catch (err) { console.error('Ошибка:', err); document.getElementById('mainContent').innerHTML = '<div style="padding:20px;color:#ff7b7b;"><h2>Ошибка</h2><p>' + (err.message || err) + '</p></div>'; }
    </script>
</body>

</html>
